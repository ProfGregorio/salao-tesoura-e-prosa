<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Novo Agendamento - Salão Tesoura e Prosa</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8">

            <h1 class="h3 mb-2">Novo agendamento</h1>

            <p class="text-muted mb-4">
                Escolha o serviço e informe quando deseja
                ser atendido.
            </p>

            <div th:if="${erro}"
                 class="alert alert-danger"
                 th:text="${erro}"></div>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <form th:action="@{/agendamentos/novo}"
                          th:object="${form}"
                          method="post">

                        <div class="mb-3">

                            <label for="servico"
                                   class="form-label">
                                Serviço desejado
                            </label>

                            <input type="text"
                                   id="servico"
                                   class="form-control"
                                   th:field="*{servico}"
                                   maxlength="120"
                                   placeholder="Informe o serviço"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label for="dataHora"
                                   class="form-label">
                                Data e horário desejados
                            </label>

                            <input type="datetime-local"
                                   id="dataHora"
                                   class="form-control"
                                   th:field="*{dataHora}"
                                   required>

                            <div class="form-text">
                                A solicitação dependerá
                                de confirmação do salão.
                            </div>

                        </div>

                        <div class="mb-3">

                            <label for="observacao"
                                   class="form-label">
                                Observações
                            </label>

                            <textarea id="observacao"
                                      class="form-control"
                                      th:field="*{observacao}"
                                      rows="3"
                                      maxlength="500"
                                      placeholder="Informações adicionais"></textarea>

                        </div>

                        <div class="d-flex justify-content-end
                                    flex-wrap gap-2 mt-4">

                            <a th:href="@{/cliente/painel}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">
                                Solicitar agendamento
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

</body>
</html>
