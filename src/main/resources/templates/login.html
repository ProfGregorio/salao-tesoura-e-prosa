
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Login - Salão de Beleza</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<!-- MENU -->
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-6 col-lg-4">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h1 class="h4 text-center mb-4">
                        Acesso ao Sistema
                    </h1>

                    <!-- ERRO DE LOGIN -->
                    <div th:if="${param.erro}"
                         class="alert alert-danger">
                        Usuário ou senha inválidos.
                    </div>

                    <!-- LOGOUT -->
                    <div th:if="${param.sair}"
                         class="alert alert-success">
                        Você saiu do sistema.
                    </div>

                    <!-- FORMULÁRIO -->
                    <form th:action="@{/login}"
                          method="post">

                        <div class="mb-3">
                            <label for="username"
                                   class="form-label">
                                Usuário
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="username"
                                   name="username"
                                   required
                                   autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="password"
                                   class="form-label">
                                Senha
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Entrar
                        </button>

                    </form>

                </div>
            </div>

        </div>

    </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

</body>
</html>
