

<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Meus Dados - Salão Tesoura e Prosa</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-4">

    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">

            <h1 class="h3 mb-2">Meus dados cadastrais</h1>
            <p class="text-muted mb-4">
                Mantenha suas informações atualizadas.
            </p>

            <div th:if="${erro}"
                 class="alert alert-danger"
                 th:text="${erro}"></div>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="@{/cliente/perfil}"
                          th:object="${form}"
                          method="post">

                        <h2 class="h5 mb-3">Dados pessoais</h2>

                        <div class="row g-3">

                            <div class="col-12">
                                <label class="form-label">
                                    Nome completo
                                </label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{nome}"
                                       maxlength="150"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">CPF</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{cpf}"
                                       maxlength="14"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">
                                    Data de nascimento
                                </label>
                                <input type="date"
                                       class="form-control"
                                       th:field="*{dataNasc}"
                                       required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">E-mail</label>
                                <input type="email"
                                       class="form-control"
                                       th:field="*{email}"
                                       maxlength="150"
                                       required>
                            </div>

                        </div>

                        <hr class="my-4">

                        <h2 class="h5 mb-3">Endereço</h2>

                        <div class="row g-3">

                            <div class="col-md-4">
                                <label class="form-label">CEP</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{cep}"
                                       maxlength="9"
                                       required>
                            </div>

                            <div class="col-md-8">
                                <label class="form-label">
                                    Logradouro
                                </label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{logradouro}"
                                       required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Número</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{numero}"
                                       required>
                            </div>

                            <div class="col-md-8">
                                <label class="form-label">
                                    Complemento
                                </label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{complemento}">
                            </div>

                            <div class="col-md-5">
                                <label class="form-label">Bairro</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{bairro}"
                                       required>
                            </div>

                            <div class="col-md-5">
                                <label class="form-label">Cidade</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{cidade}"
                                       required>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label">UF</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{estado}"
                                       maxlength="2"
                                       required>
                            </div>

                        </div>

                        <div class="d-flex justify-content-end
                                    flex-wrap gap-2 mt-4">

                            <a th:href="@{/cliente/painel}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">
                                Salvar alterações
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

</body>
</html>
